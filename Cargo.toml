[package]
name = "ctrl-cli"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "ctrl-cli"
path = "src/main.rs"

[[bin]]
name = "ctrl-cli-tui"
path = "src/bin/ctrl-cli-tui.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rustyline = "15.0"
ureq = { version = "2.10", features = ["json", "tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inquire = "0.7"
ratatui = "0.30"
crossterm = "0.29"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
